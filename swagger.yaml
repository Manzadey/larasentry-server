openapi: 3.0.3
info:
  title: LaraSentry API
  version: 2.0.0
  description: |
    Официальная спецификация REST API микросервиса LaraSentry на русском языке.
    Включает прием событий ошибок от Laravel, управление жизненным циклом инцидентов,
    трекинг версий и деплоев из CI/CD, аналитику и мониторинг в реальном времени.
servers:
  - url: http://localhost:8080
    description: Локальный сервер
paths:
  # ============================================================================
  # 1. EVENTS (Прием событий)
  # ============================================================================
  /api/events:
    post:
      summary: Отправить событие ошибки (Event Ingestion)
      description: |
        Принимает и валидирует входящий payload исключения из Laravel-приложения (через larasentry-client).
        Обработка происходит асинхронно: запрос ставится в неблокирующую очередь в памяти (channel),
        вычисляется уникальный MD5-хеш ошибки и клиенту возвращается статус 202 Accepted.
        Если ошибка повторяется, инцидент дедуплицируется и счетчик повторов увеличивается.
      tags:
        - Events (Прием событий)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: JSON-пейлоад с детальной информацией об ошибке из Laravel
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPayload'
      responses:
        '202':
          description: Событие успешно принято в очередь обработки. Возвращает UUID события и вычисленный хеш инцидента.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/events/batch:
    post:
      summary: Пакетная отправка событий ошибок (Batch Ingestion)
      description: |
        Позволяет отправить массив ошибок (до 50 событий) за один HTTP-запрос.
        Используется для периодического сброса локального буфера очередей в Laravel или снижения сетевых накладных расходов при пиковых нагрузках.
      tags:
        - Events (Прием событий)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Объект, содержащий массив событий ошибок
        content:
          application/json:
            schema:
              type: object
              required:
                - events
              properties:
                events:
                  type: array
                  maxItems: 50
                  description: Список событий ошибок (не более 50 за один запрос)
                  items:
                    $ref: '#/components/schemas/EventPayload'
      responses:
        '202':
          description: Пачка событий успешно принята в очередь обработки
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
                    description: Статус операции
                  accepted_count:
                    type: integer
                    example: 15
                    description: Количество успешно принятых событий
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # 2. INCIDENTS (Управление инцидентами)
  # ============================================================================
  /api/incidents:
    get:
      summary: Список инцидентов с фильтрацией и пагинацией
      description: |
        Возвращает постраничный список сгруппированных инцидентов проекта.
        Поддерживает фильтрацию по статусу, окружению, версии релиза, поисковой строке,
        только регрессиям, а также сортировку и пагинацию с метаданными.
      tags:
        - Incidents (Инциденты)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: "Статус инцидента: unresolved (нерешенные, по умолчанию), resolved (закрытые), ignored (заглушенные), all (все)"
          schema:
            type: string
            enum: [unresolved, resolved, ignored, all]
            default: unresolved
        - name: q
          in: query
          required: false
          description: Поисковый запрос для фильтрации по тексту сообщения, классу исключения, пути к файлу или URL
          schema:
            type: string
            example: DivisionByZeroError
        - name: environment
          in: query
          required: false
          description: "Окружение исполнения (например: production, staging, local)"
          schema:
            type: string
            example: production
        - name: release
          in: query
          required: false
          description: Фильтр по версии релиза приложения (по первому или последнему появлению)
          schema:
            type: string
            example: 1.2.0
        - name: is_regression
          in: query
          required: false
          description: "Флаг регрессии: true — показать только ошибки, вернувшиеся после закрытия"
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          description: "Порядок сортировки: recent (свежие по дате последнего появления), count (по частоте повторов), first_seen (хронологически по дате первого сбоя)"
          schema:
            type: string
            enum: [recent, count, first_seen]
            default: recent
        - name: page
          in: query
          required: false
          description: Номер страницы для пагинации (начиная с 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Количество записей на странице (от 1 до 200, по умолчанию 50)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: include_trace
          in: query
          required: false
          description: Включать ли полный StackTrace в каждый элемент списка (по умолчанию false для экономии сетевого трафика)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Успешный возврат списка инцидентов с объектом пагинации meta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/incidents/{id}:
    get:
      summary: Детальная карточка инцидента
      description: |
        Возвращает полную информацию об инциденте: полный стектрейс ошибки,
        очищенный стектрейс приложения (без сторонних библиотек vendor/laravel/symfony),
        статистику фреймов кода и историю первого/последнего появления.
      tags:
        - Incidents (Инциденты)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentID'
      responses:
        '200':
          description: Полная информация об инциденте со стектрейсами и статистикой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Удалить инцидент
      description: Безвозвратно удаляет запись об инциденте из базы данных. Используется для очистки спама или тестовых ошибок.
      tags:
        - Incidents (Инциденты)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentID'
      responses:
        '204':
          description: Инцидент успешно удален (тело ответа пустое)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/incidents/{id}/resolve:
    post:
      summary: Закрыть (резолвить) инцидент
      description: |
        Помечает инцидент как решенный со стратегией отслеживания повторений:
        - immediate: закрыть немедленно (при любом новом появлении инцидент переоткроется);
        - next: исправлен в следующем релизе (новые события из текущего релиза будут глушиться);
        - current: исправлен в текущем активном релизе проекта;
        - version: исправлен в конкретной версии (напр. 1.4.3). События из более старых версий игнорируются, а в версии >= указанной — фиксируется регрессия.
      tags:
        - Incidents Lifecycle (Жизненный цикл)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentID'
      requestBody:
        required: false
        description: Параметры стратегии резолва ошибки
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: Инцидент успешно закрыт. Возвращает обновленные данные инцидента.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/incidents/{id}/reopen:
    post:
      summary: Переоткрыть инцидент
      description: Переводит ранее закрытый или заглушенный инцидент обратно в активный статус 'unresolved', сбрасывая статус резолва и флаг регрессии.
      tags:
        - Incidents Lifecycle (Жизненный цикл)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentID'
      responses:
        '200':
          description: Инцидент успешно переоткрыт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/incidents/{id}/ignore:
    post:
      summary: Заглушить / Игнорировать инцидент
      description: Переводит инцидент в статус 'ignored'. События продолжат агрегироваться и подсчитываться в базе, но уведомления в Telegram отправляться не будут.
      tags:
        - Incidents Lifecycle (Жизненный цикл)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentID'
      requestBody:
        required: false
        description: Флаг игнорирования
        content:
          application/json:
            schema:
              type: object
              properties:
                ignored:
                  type: boolean
                  default: true
                  description: true — заглушить инцидент, false — вернуть в нерешенные
      responses:
        '200':
          description: Статус игнорирования успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/incidents/batch:
    post:
      summary: Пакетные действия над несколькими инцидентами
      description: Выполняет групповое действие в рамках единой транзакции для массива ID инцидентов: закрыть (resolve), переоткрыть (reopen), заглушить (ignore) или удалить (delete).
      tags:
        - Incidents Lifecycle (Жизненный цикл)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Параметры пакетной операции
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIncidentsRequest'
      responses:
        '200':
          description: Операция успешно выполнена
          content:
            application/json:
              schema:
                type: object
                properties:
                  affected:
                    type: integer
                    example: 5
                    description: Количество обновленных записей
                  action:
                    type: string
                    example: resolve
                    description: Выполненное действие
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # 3. RELEASES (Релизы и Деплои)
  # ============================================================================
  /api/releases:
    get:
      summary: Список релизов проекта
      description: Возвращает историю версий и деплоев приложения с агрегированной статистикой по каждой версии: общее число ошибок, количество новых багов и регрессий.
      tags:
        - Releases (Релизы и Деплои)
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Максимальное количество возвращаемых релизов (по умолчанию 20)
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Список версий с метриками стабильности
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReleaseSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Зарегистрировать новый релиз (CI/CD деплой-хук)
      description: |
        Используется в пайплайнах CI/CD (GitHub Actions, GitLab CI, Bitbucket Pipelines)
        для оповещения сервера о выкатке новой версии приложения. Фиксирует версию, ветку и коммит.
      tags:
        - Releases (Релизы и Деплои)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Данные о выкатываемом релизе
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReleaseRequest'
      responses:
        '201':
          description: Релиз успешно создан и зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/releases/{version}/incidents:
    get:
      summary: Список инцидентов конкретной версии
      description: Возвращает ошибки, зафиксированные в указанной версии релиза. Позволяет мгновенно оценить качество и стабильность свежего релиза.
      tags:
        - Releases (Релизы и Деплои)
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: path
          required: true
          description: Семантический номер версии (например: 1.4.3 или v2.1.0)
          schema:
            type: string
        - name: new_only
          in: query
          required: false
          description: Показывать только те ошибки, которые впервые появились именно в этой версии
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Список ошибок релиза
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # 4. ANALYTICS & STATS (Аналитика и Метрики)
  # ============================================================================
  /api/stats/summary:
    get:
      summary: Сводная аналитика и счетчики проекта
      description: Возвращает ключевые показатели для дашбордов и мониторинга: общее количество инцидентов, нерешенные, решенные, заглушенные, число регрессий и объем событий за последние 24 часа.
      tags:
        - Analytics (Аналитика и Метрики)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Сводные счетчики проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # 5. REALTIME STREAMING & SYSTEM
  # ============================================================================
  /api/events/stream:
    get:
      summary: Поток событий в реальном времени (Server-Sent Events)
      description: |
        Постоянное соединение Server-Sent Events (SSE), передающее события новых ошибок (incident_new),
        регрессий (regression) и обновления счетчиков в формате JSON.
        Подходит для внешних утилит, ботов и кастомных дашбордов.
      tags:
        - Realtime (Потоковая передача)
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: query
          required: false
          description: API-ключ проекта (query-параметр для поддержки стандартного браузерного EventSource)
          schema:
            type: string
      responses:
        '200':
          description: Поток Server-Sent Events (SSE) успешно установлен
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: incident_new
                  data: {"id":42,"hash":"abc123","exception_class":"RuntimeException","message":"Connection timed out"}

                  event: regression
                  data: {"id":15,"hash":"def456","last_release":"1.4.0","message":"Undefined array key 'user'"}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/{id}/github:
    put:
      summary: Настройка интеграции с GitHub
      description: Привязка проекта к репозиторию из подключённых аккаунтов GitHub (см. страницу /ui/github), ветки и префикса путей. github_repo_id = 0 отвязывает репозиторий.
      tags:
        - Projects (Проекты)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID проекта
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                github_repo_id:
                  type: integer
                  example: 7
                  description: ID репозитория из github_repos; репозиторий должен быть выбран в аккаунте. Обязательное поле, 0 отвязывает репозиторий
                github_branch:
                  type: string
                  example: main
                path_prefix:
                  type: string
                  example: /var/www/html
      responses:
        '200':
          description: Настройки GitHub успешно обновлены
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                  project_id:
                    type: integer
        '400':
          description: Неверный JSON, не передан github_repo_id или репозиторий не найден среди выбранных
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/health:
    get:
      summary: Проверка работоспособности сервиса (Health Check)
      description: Liveness/Readiness проба для Docker и Kubernetes. Возвращает статус сервиса, доступность базы SQLite, текущий размер очереди в памяти и время непрерывной работы (uptime).
      tags:
        - System (Система)
      responses:
        '200':
          description: Сервис полностью исправен и готов принимать запросы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Проблемы в работе сервиса (например, база данных недоступна)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

# ==============================================================================
# COMPONENTS (Схемы, Параметры, Ответы)
# ==============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Авторизационный Bearer-токен проекта (API Key)"

  parameters:
    IncidentID:
      name: id
      in: path
      required: true
      description: Уникальный числовой идентификатор инцидента в базе данных
      schema:
        type: integer
        format: int64
        example: 42

  responses:
    BadRequest:
      description: Некорректный запрос (невалидный JSON или синтаксис)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Ошибка авторизации (отсутствует или недействителен Bearer API Key)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Доступ запрещен (IP-адрес клиента не входит в белый список ALLOWED_IPS)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Описание возникшей ошибки
          example: Invalid API Key
        details:
          type: string
          description: Подробности ошибки
          example: Authorization header must start with Bearer

    UserContext:
      type: object
      description: Данные об авторизованном пользователе на момент сбоя
      properties:
        id:
          type: string
          description: ID пользователя в вашей системе
          example: "1054"
        email:
          type: string
          description: Email пользователя
          example: user@example.com
        ip_address:
          type: string
          description: IP-адрес пользователя
          example: 198.51.100.42

    EventPayload:
      type: object
      required:
        - exception_class
        - message
      description: JSON-пейлоад с детальной информацией об ошибке из Laravel
      properties:
        exception_class:
          type: string
          description: Полное имя класса исключения в PHP/Laravel
          example: Illuminate\Database\QueryException
        message:
          type: string
          description: Текст сообщения об ошибке
          example: SQLSTATE[HY000] [2002] Connection refused
        file:
          type: string
          description: Абсолютный путь к файлу исходного кода, где произошло исключение
          example: /var/www/app/Http/Controllers/OrderController.php
        line:
          type: integer
          description: Номер строки в файле
          example: 87
        stack_trace:
          type: string
          description: Полный стектрейс исключения
          example: "#0 /var/www/app/Http/Controllers/OrderController.php(87): DB::table('orders')->get()..."
        release:
          type: string
          description: Текущая версия приложения (из config/app.php или .env)
          example: 1.4.2
        environment:
          type: string
          description: Окружение приложения (production, staging, local и т.д.)
          example: production
          default: production
        php_version:
          type: string
          description: Версия PHP runtime на клиенте (из константы PHP_VERSION)
          example: 8.2.18
        laravel_version:
          type: string
          description: Версия фреймворка Laravel (из app()->version())
          example: 11.28.0
        app_url:
          type: string
          description: Базовый URL приложения (APP_URL)
          example: https://shop.example.com
        request_url:
          type: string
          description: Конкретный URL HTTP-запроса, вызвавший исключение
          example: https://shop.example.com/api/v1/orders/checkout
        request_method:
          type: string
          description: HTTP-метод запроса
          example: POST
        level:
          type: string
          enum: [critical, error, warning, info]
          default: error
          description: Уровень критичности события
        user:
          $ref: '#/components/schemas/UserContext'
        tags:
          type: object
          additionalProperties:
            type: string
          description: Произвольные пользовательские теги
          example:
            queue: orders
            job: ProcessOrderJob
        fingerprint:
          type: array
          items:
            type: string
          description: Кастомные параметры для вычисления хеша группировки
        route:
          type: object
          description: Контекст маршрута фреймворка (Laravel Route)
          properties:
            name:
              type: string
              example: orders.checkout
            action:
              type: string
              example: App\Http\Controllers\OrderController@checkout
            middleware:
              type: array
              items:
                type: string
            parameters:
              type: object
        http_request:
          type: object
          description: Расширенный контекст входящего HTTP-запроса
          properties:
            url:
              type: string
            method:
              type: string
            query_string:
              type: string
            query_params:
              type: object
            headers:
              type: object
              additionalProperties:
                type: string
            client_ip:
              type: string
            body:
              type: object
        execution:
          type: object
          description: Контекст режима выполнения (HTTP, Очереди, Artisan CLI)
          properties:
            type:
              type: string
              enum: [http, queue, console]
            is_cli:
              type: boolean
            command:
              type: string
            queue_job:
              type: object
              properties:
                job_name:
                  type: string
                queue:
                  type: string
                connection:
                  type: string
                attempts:
                  type: integer
                max_tries:
                  type: integer
                timeout:
                  type: integer
        breadcrumbs:
          type: array
          description: Кольцевой буфер последних событий приложения
          items:
            type: object
            properties:
              category:
                type: string
                enum: [sql, log, http, queue, cache]
              level:
                type: string
              message:
                type: string
              data:
                type: object
              timestamp:
                type: number
        system:
          type: object
          description: Ресурсы и системное окружение
          properties:
            php_version:
              type: string
            laravel_version:
              type: string
            memory_usage_bytes:
              type: integer
            memory_peak_bytes:
              type: integer
            duration_ms:
              type: number
            hostname:
              type: string
            os:
              type: string
            sapi:
              type: string
            locale:
              type: string
            config_cached:
              type: boolean
            routes_cached:
              type: boolean

    EventAcceptedResponse:
      type: object
      required:
        - status
        - event_id
        - hash
      description: Ответ об успешном приеме события
      properties:
        status:
          type: string
          example: accepted
          description: Статус приема события
        event_id:
          type: string
          format: uuid
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
          description: Уникальный UUID принятого события
        hash:
          type: string
          description: Хеш группировки инцидента (MD5)
          example: e99a18c428cb38d5f260853678922e03

    Incident:
      type: object
      description: Сгруппированный инцидент
      properties:
        id:
          type: integer
          format: int64
          example: 42
          description: Уникальный ID инцидента
        project_id:
          type: integer
          format: int64
          example: 1
          description: ID проекта
        project_name:
          type: string
          example: Billing Microservice
          description: Название проекта
        hash:
          type: string
          example: e99a18c428cb38d5f260853678922e03
          description: MD5-хеш группировки
        exception_class:
          type: string
          example: Illuminate\Database\QueryException
          description: Класс исключения
        message:
          type: string
          example: SQLSTATE[HY000] [2002] Connection refused
          description: Сообщение об ошибке
        file:
          type: string
          example: /var/www/app/Http/Controllers/OrderController.php
          description: Файл возникновения ошибки
        line:
          type: integer
          example: 87
          description: Строка ошибки
        app_url:
          type: string
          example: https://shop.example.com
          description: Базовый URL приложения
        request_url:
          type: string
          example: https://shop.example.com/api/v1/orders/checkout
          description: URL запроса
        events_count:
          type: integer
          example: 34
          description: Общее количество повторений ошибки
        first_seen_at:
          type: string
          format: date-time
          example: "2026-10-10T14:20:00Z"
          description: Дата и время первого сбоя
        last_seen_at:
          type: string
          format: date-time
          example: "2026-10-11T12:05:30Z"
          description: Дата и время последнего сбоя
        environment:
          type: string
          example: production
          description: Окружение
        first_release:
          type: string
          example: 1.3.9
          description: Версия, в которой ошибка появилась впервые
        last_release:
          type: string
          example: 1.4.2
          description: Версия последнего сбоя
        php_version:
          type: string
          example: 8.2.18
          description: Версия PHP runtime, на которой произошел сбой
        laravel_version:
          type: string
          example: 11.28.0
          description: Версия фреймворка Laravel, на которой произошел сбой
        status:
          type: string
          enum: [unresolved, resolved, ignored]
          example: unresolved
          description: "Текущий статус: unresolved, resolved, ignored"
        resolved_in_release:
          type: string
          example: 1.4.1
          description: Версия, в которой ошибка была закрыта
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: Дата закрытия ошибки
        is_regression:
          type: boolean
          example: false
          description: Флаг регрессии

    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/Incident'
        - type: object
          description: Детальные стектрейсы инцидента
          properties:
            stack_trace:
              type: string
              description: Полный необработанный стектрейс
            app_stack_trace:
              type: string
              description: Очищенный стектрейс (только фреймы кода приложения, без vendor библиотек)
            stack_trace_stats:
              type: object
              description: Статистика стека вызовов
              properties:
                total_frames:
                  type: integer
                  example: 24
                  description: Общее число фреймов
                app_frames:
                  type: integer
                  example: 3
                  description: Число фреймов собственного кода

    IncidentListResponse:
      type: object
      required:
        - items
        - meta
      description: Постраничный список инцидентов
      properties:
        items:
          type: array
          description: Инциденты текущей страницы
          items:
            $ref: '#/components/schemas/Incident'
        meta:
          $ref: '#/components/schemas/PageMeta'

    PageMeta:
      type: object
      required:
        - total
        - page
        - limit
        - total_pages
      description: Метаданные пагинации
      properties:
        total:
          type: integer
          example: 125
          description: Всего записей по заданному фильтру
        page:
          type: integer
          example: 1
          description: Текущая страница
        limit:
          type: integer
          example: 50
          description: Количество элементов на странице
        total_pages:
          type: integer
          example: 3
          description: Всего доступных страниц

    ResolveRequest:
      type: object
      description: Параметры закрытия инцидента
      properties:
        type:
          type: string
          enum: [immediate, next, current, version]
          default: immediate
          description: "Стратегия резолва: immediate, next, current, version"
          example: next
        version:
          type: string
          description: Целевая версия (обязательна, если type=version)
          example: 1.4.3

    BatchIncidentsRequest:
      type: object
      required:
        - action
        - ids
      description: Параметры групповых действий над инцидентами
      properties:
        action:
          type: string
          enum: [resolve, reopen, ignore, delete]
          example: resolve
          description: Тип действия над группой инцидентов
        ids:
          type: array
          items:
            type: integer
            format: int64
          example: [12, 15, 23]
          description: Список числовых идентификаторов инцидентов
        params:
          $ref: '#/components/schemas/ResolveRequest'

    Release:
      type: object
      description: Информация о релизе
      properties:
        id:
          type: integer
          format: int64
          example: 5
          description: ID релиза
        project_id:
          type: integer
          format: int64
          example: 1
          description: ID проекта
        version:
          type: string
          example: 1.4.2
          description: Номер версии
        created_at:
          type: string
          format: date-time
          example: "2026-10-10T10:00:00Z"
          description: Дата создания релиза

    ReleaseSummary:
      allOf:
        - $ref: '#/components/schemas/Release'
        - type: object
          description: Статистика надежности релиза
          properties:
            total_incidents:
              type: integer
              example: 18
              description: Общее число инцидентов в этом релизе
            new_incidents:
              type: integer
              example: 3
              description: Ошибки, впервые появившиеся в этой версии
            regressions_count:
              type: integer
              example: 1
              description: Количество активных регрессий

    CreateReleaseRequest:
      type: object
      required:
        - version
      description: Параметры создания релиза
      properties:
        version:
          type: string
          description: Версия приложения (напр. 1.4.3 или v2.0.0)
          example: 1.4.3
        ref:
          type: string
          description: Git-ветка или тег
          example: refs/heads/main
        commit:
          type: string
          description: SHA-1 коммита
          example: 7bf81204d80a187e8349257e804f323e1f579124

    StatsSummary:
      type: object
      description: Сводные показатели проекта
      properties:
        total_incidents:
          type: integer
          example: 142
          description: Всего инцидентов
        unresolved:
          type: integer
          example: 14
          description: Нерешенных инцидентов
        resolved:
          type: integer
          example: 121
          description: Закрытых инцидентов
        ignored:
          type: integer
          example: 7
          description: Заглушенных инцидентов
        regressions:
          type: integer
          example: 2
          description: Активных регрессий
        events_last_24h:
          type: integer
          example: 3850
          description: Количество ошибок за последние 24 часа
        active_releases_count:
          type: integer
          example: 4
          description: Количество активных версий

    HealthStatus:
      type: object
      required:
        - status
        - database
        - uptime
      description: Диагностический статус системы
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          example: ok
          description: Статус работоспособности сервиса
        database:
          type: string
          enum: [healthy, unreachable]
          example: healthy
          description: Доступность базы данных SQLite
        queue_size:
          type: integer
          description: Текущее количество событий в очереди воркера в памяти
          example: 12
        uptime:
          type: string
          description: Время непрерывной работы процесса
          example: 48h22m15s
