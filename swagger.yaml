openapi: 3.0.3
info:
  title: LaraSentry API
  version: 1.0.0
  description: API documentation for LaraSentry Go Server.
servers:
  - url: http://localhost:8080
    description: Local server
paths:
  /api/events:
    post:
      summary: Send a new error event
      description: Receives an exception/error payload from a Laravel application.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPayload'
      responses:
        '202':
          description: Event accepted for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
        '400':
          description: Bad Request (Invalid JSON or missing required fields)
        '401':
          description: Unauthorized (Invalid or missing API key)
        '403':
          description: Forbidden (IP not allowed)
        '405':
          description: Method Not Allowed
  /api/incidents:
    get:
      summary: List incidents
      description: Returns the latest 100 grouped incidents for the authenticated project.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'
        '401':
          description: Unauthorized (Invalid or missing API key)
        '405':
          description: Method Not Allowed
        '500':
          description: Internal Server Error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    EventPayload:
      type: object
      required:
        - exception_class
        - message
      properties:
        exception_class:
          type: string
          description: The class name of the exception
          example: InvalidArgumentException
        message:
          type: string
          description: The error message
          example: Invalid argument provided
        file:
          type: string
          description: File where the error occurred
          example: /app/Http/Controllers/UserController.php
        line:
          type: integer
          description: Line number of the error
          example: 42
        stack_trace:
          type: string
          description: Full stack trace
        app_url:
          type: string
          description: Application URL
          example: https://example.com
        request_url:
          type: string
          description: The URL that triggered the error
          example: https://example.com/api/users
        request_method:
          type: string
          description: HTTP method used
          example: POST
    Incident:
      type: object
      description: Note that fields are capitalized in JSON as per the Go struct defaults without json tags.
      properties:
        ID:
          type: integer
          format: int64
          example: 1
        ProjectID:
          type: integer
          format: int64
          example: 123
        Hash:
          type: string
          example: a1b2c3d4e5f6
        ExceptionClass:
          type: string
          example: InvalidArgumentException
        Message:
          type: string
          example: Invalid argument provided
        File:
          type: string
          example: /app/Http/Controllers/UserController.php
        Line:
          type: integer
          example: 42
        StackTrace:
          type: string
        AppURL:
          type: string
          example: https://example.com
        RequestURL:
          type: string
          example: https://example.com/api/users
        EventsCount:
          type: integer
          example: 5
        FirstSeenAt:
          type: string
          format: date-time
        LastSeenAt:
          type: string
          format: date-time
