  /api/releases:
    get:
      description: 'Возвращает историю версий и деплоев приложения с агрегированной
        статистикой по каждой версии: общее число ошибок, количество новых багов и
        регрессий.'
      parameters:
      - default: 20
        description: Максимальное количество возвращаемых релизов
        in: query
        name: limit
        type: integer
      - description: Имя проекта (также X-Project-Name, X-App-Name). Нет такого —
          проект создаётся
        in: header
        name: X-Project
        type: string
      - description: Имя проекта, если не передан заголовок (также project_name, app)
        in: query
        name: project
        type: string
      - description: ID проекта, если имя не передано
        in: query
        name: project_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список версий с метриками стабильности
          schema:
            items:
              $ref: '#/definitions/domain.ReleaseSummary'
            type: array
        "403":
          description: IP-адрес клиента не входит в ALLOWED_IPS и запрос пришёл не
            с хоста сервиса
        "500":
          description: Не удалось определить проект или прочитать базу
      summary: Список релизов проекта
      tags:
      - Releases (Релизы и Деплои)
    post:
      consumes:
      - application/json
      description: Используется в пайплайнах CI/CD (GitHub Actions, GitLab CI, Bitbucket)
        для оповещения сервера о выкатке новой версии приложения. Фиксирует версию,
        ветку и коммит.
      parameters:
      - description: Данные о выкатываемом релизе
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateReleaseRequest'
      - description: Имя проекта (также X-Project-Name, X-App-Name). Нет такого —
          проект создаётся
        in: header
        name: X-Project
        type: string
      - description: Имя проекта, если не передан заголовок (также project_name, app)
        in: query
        name: project
        type: string
      - description: ID проекта, если имя не передано
        in: query
        name: project_id
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Релиз успешно создан и зарегистрирован
          schema:
            $ref: '#/definitions/domain.Release'
        "400":
          description: Не указан обязательный номер версии
        "403":
          description: IP-адрес клиента не входит в ALLOWED_IPS и запрос пришёл не
            с хоста сервиса
      summary: Зарегистрировать новый релиз (CI/CD деплой-хук)
      tags:
      - Releases (Релизы и Деплои)
  /api/releases/{version}/incidents:
    get:
