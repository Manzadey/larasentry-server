basePath: /
definitions:
  domain.AppContext:
    properties:
      exception:
        additionalProperties: {}
        type: object
      shared:
        additionalProperties: {}
        type: object
    type: object
  domain.BatchIncidentsRequest:
    properties:
      action:
        description: '"resolve", "reopen", "ignore", "delete"'
        type: string
      ids:
        items:
          type: integer
        type: array
      params:
        $ref: '#/definitions/domain.ResolveRequest'
    type: object
  domain.Breadcrumb:
    properties:
      category:
        description: '"sql" | "log" | "http" | "queue" | "cache"'
        type: string
      data:
        additionalProperties: {}
        type: object
      level:
        description: '"info" | "warning" | "error"'
        type: string
      message:
        type: string
      timestamp:
        type: number
    type: object
  domain.CodeLine:
    properties:
      code:
        type: string
      is_error:
        type: boolean
      number:
        type: integer
    type: object
  domain.CodeSnippet:
    properties:
      file:
        type: string
      github_url:
        type: string
      line:
        type: integer
      lines:
        items:
          $ref: '#/definitions/domain.CodeLine'
        type: array
      source:
        description: '"client" | "github"'
        type: string
    type: object
  domain.CreateReleaseRequest:
    properties:
      commit:
        type: string
      project:
        type: string
      ref:
        type: string
      version:
        type: string
    type: object
  domain.EventPayload:
    properties:
      app_url:
        type: string
      breadcrumbs:
        items:
          $ref: '#/definitions/domain.Breadcrumb'
        type: array
      code_snippet:
        $ref: '#/definitions/domain.CodeSnippet'
      commit:
        type: string
      context:
        $ref: '#/definitions/domain.AppContext'
      environment:
        type: string
      exception_class:
        type: string
      execution:
        $ref: '#/definitions/domain.ExecutionContext'
      file:
        type: string
      fingerprint:
        items:
          type: string
        type: array
      http_request:
        $ref: '#/definitions/domain.HTTPRequestContext'
      laravel_version:
        type: string
      level:
        type: string
      line:
        type: integer
      message:
        type: string
      php_version:
        type: string
      project:
        type: string
      project_name:
        type: string
      release:
        type: string
      request_method:
        type: string
      request_url:
        type: string
      route:
        $ref: '#/definitions/domain.RouteContext'
      stack_trace:
        type: string
      system:
        $ref: '#/definitions/domain.SystemContext'
      tags:
        additionalProperties:
          type: string
        type: object
      user:
        $ref: '#/definitions/domain.UserContext'
    type: object
  domain.ExecutionContext:
    properties:
      command:
        type: string
      is_cli:
        type: boolean
      queue_job:
        $ref: '#/definitions/domain.QueueJobContext'
      type:
        description: '"http" | "queue" | "console"'
        type: string
    type: object
  domain.HTTPRequestContext:
    properties:
      body:
        additionalProperties: {}
        type: object
      client_ip:
        type: string
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        type: string
      query_params:
        additionalProperties: {}
        type: object
      query_string:
        type: string
      url:
        type: string
    type: object
  domain.HealthStatus:
    properties:
      database:
        type: string
      queue_size:
        type: integer
      status:
        type: string
      uptime:
        type: string
    type: object
  domain.Incident:
    properties:
      app_context:
        $ref: '#/definitions/domain.AppContext'
      app_url:
        type: string
      breadcrumbs:
        items:
          $ref: '#/definitions/domain.Breadcrumb'
        type: array
      code_snippet:
        $ref: '#/definitions/domain.CodeSnippet'
      environment:
        type: string
      events_count:
        type: integer
      exception_class:
        type: string
      execution:
        $ref: '#/definitions/domain.ExecutionContext'
      execution_type:
        type: string
      file:
        type: string
      first_release:
        type: string
      first_seen_at:
        type: string
      hash:
        type: string
      http_request:
        $ref: '#/definitions/domain.HTTPRequestContext'
      id:
        type: integer
      is_regression:
        type: boolean
      laravel_version:
        type: string
      last_release:
        type: string
      last_seen_at:
        type: string
      line:
        type: integer
      message:
        type: string
      php_version:
        type: string
      project_id:
        type: integer
      project_name:
        type: string
      queue_job:
        $ref: '#/definitions/domain.QueueJobContext'
      request_url:
        type: string
      resolved_at:
        type: string
      resolved_in_release:
        type: string
      route:
        $ref: '#/definitions/domain.RouteContext'
      route_action:
        type: string
      route_name:
        type: string
      stack_trace:
        type: string
      status:
        $ref: '#/definitions/domain.IncidentStatus'
      system:
        $ref: '#/definitions/domain.SystemContext'
    type: object
  domain.IncidentDetail:
    properties:
      app_context:
        $ref: '#/definitions/domain.AppContext'
      app_stack_trace:
        type: string
      app_url:
        type: string
      breadcrumbs:
        items:
          $ref: '#/definitions/domain.Breadcrumb'
        type: array
      code_snippet:
        $ref: '#/definitions/domain.CodeSnippet'
      environment:
        type: string
      events_count:
        type: integer
      exception_class:
        type: string
      execution:
        $ref: '#/definitions/domain.ExecutionContext'
      execution_type:
        type: string
      file:
        type: string
      first_release:
        type: string
      first_seen_at:
        type: string
      hash:
        type: string
      http_request:
        $ref: '#/definitions/domain.HTTPRequestContext'
      id:
        type: integer
      is_regression:
        type: boolean
      laravel_version:
        type: string
      last_release:
        type: string
      last_seen_at:
        type: string
      line:
        type: integer
      message:
        type: string
      php_version:
        type: string
      project_id:
        type: integer
      project_name:
        type: string
      queue_job:
        $ref: '#/definitions/domain.QueueJobContext'
      request_url:
        type: string
      resolved_at:
        type: string
      resolved_in_release:
        type: string
      route:
        $ref: '#/definitions/domain.RouteContext'
      route_action:
        type: string
      route_name:
        type: string
      stack_trace:
        type: string
      stack_trace_stats:
        $ref: '#/definitions/domain.StackTraceStats'
      status:
        $ref: '#/definitions/domain.IncidentStatus'
      system:
        $ref: '#/definitions/domain.SystemContext'
    type: object
  domain.IncidentListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Incident'
        type: array
      meta:
        $ref: '#/definitions/domain.PageMeta'
    type: object
  domain.IncidentStatus:
    enum:
    - unresolved
    - resolved
    - ignored
    type: string
    x-enum-varnames:
    - StatusUnresolved
    - StatusResolved
    - StatusIgnored
  domain.PageMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  domain.QueueJobContext:
    properties:
      attempts:
        type: integer
      connection:
        type: string
      job_name:
        type: string
      max_tries:
        type: integer
      queue:
        type: string
      timeout:
        type: integer
    type: object
  domain.Release:
    properties:
      commit:
        type: string
      created_at:
        type: string
      id:
        type: integer
      project_id:
        type: integer
      ref:
        type: string
      version:
        type: string
    type: object
  domain.ReleaseSummary:
    properties:
      commit:
        type: string
      created_at:
        type: string
      id:
        type: integer
      new_incidents:
        type: integer
      project_id:
        type: integer
      ref:
        type: string
      regressions_count:
        type: integer
      total_incidents:
        type: integer
      version:
        type: string
    type: object
  domain.ResolveRequest:
    properties:
      type:
        description: '"immediate", "next", "current", "version"'
        type: string
      version:
        description: целевая версия, если type == "version"
        type: string
    type: object
  domain.RouteContext:
    properties:
      action:
        type: string
      middleware:
        items:
          type: string
        type: array
      name:
        type: string
      parameters:
        additionalProperties: {}
        type: object
    type: object
  domain.StackTraceStats:
    properties:
      appFrames:
        type: integer
      totalFrames:
        type: integer
    type: object
  domain.StatsSummary:
    properties:
      active_releases_count:
        type: integer
      events_last_24h:
        type: integer
      ignored:
        type: integer
      regressions:
        type: integer
      resolved:
        type: integer
      total_incidents:
        type: integer
      unresolved:
        type: integer
    type: object
  domain.SystemContext:
    properties:
      config_cached:
        type: boolean
      duration_ms:
        type: number
      hostname:
        type: string
      laravel_version:
        type: string
      locale:
        type: string
      memory_peak_bytes:
        type: integer
      memory_usage_bytes:
        type: integer
      os:
        type: string
      php_version:
        type: string
      routes_cached:
        type: boolean
      sapi:
        type: string
    type: object
  domain.UserContext:
    properties:
      email:
        type: string
      id:
        type: string
      ip_address:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    REST API LaraSentry: приём ошибок от Laravel, жизненный цикл инцидентов, релизы из CI/CD, аналитика и поток событий.
    Ключ не нужен: проект определяется по имени, а доступ ограничен ALLOWED_IPS (пусто — только хост сервиса).
  title: LaraSentry API
  version: "2.0"
paths:
  /api/events:
    post:
      consumes:
      - application/json
      description: 'Принимает и валидирует входящий payload исключения из Laravel-приложения
        (через larasentry-client). Обработка происходит асинхронно: запрос ставится
        в неблокирующую очередь в памяти (channel), вычисляется уникальный MD5-хеш
        ошибки и клиенту возвращается статус 202 Accepted. Если ошибка повторяется,
        инцидент дедуплицируется и счетчик увеличивается.'
      parameters:
      - description: JSON-пейлоад с детальной информацией об исключении из Laravel
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.EventPayload'
      - description: Имя проекта (также X-Project-Name, X-App-Name). Нет такого —
          проект создаётся
        in: header
        name: X-Project
        type: string
      - description: Имя проекта, если не передан заголовок (также project_name, app)
        in: query
        name: project
        type: string
      - description: ID проекта, если имя не передано
        in: query
        name: project_id
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Событие успешно принято в очередь обработки. Возвращает сгенерированный
            UUID события и MD5-хеш инцидента.
          schema:
            properties:
              event_id:
                type: string
              hash:
                type: string
              status:
                type: string
            type: object
        "400":
          description: Некорректный запрос (невалидный JSON или отсутствуют обязательные
            поля exception_class/message)
        "403":
          description: IP-адрес клиента не входит в ALLOWED_IPS и запрос пришёл не
            с хоста сервиса
      summary: Отправить событие ошибки (Event Ingestion)
      tags:
      - Events (Прием событий)
  /api/events/batch:
    post:
      consumes:
      - application/json
      description: Позволяет отправить массив ошибок (до 50 событий) за один HTTP-запрос.
        Используется для периодического сброса локального буфера очередей в Laravel
        или снижения сетевых накладных расходов при пиковых нагрузках.
      parameters:
      - description: Объект, содержащий массив событий
        in: body
        name: body
        required: true
        schema:
          properties:
            events:
              items:
                $ref: '#/definitions/domain.EventPayload'
              type: array
            project:
              type: string
          type: object
      - description: Имя проекта (также X-Project-Name, X-App-Name). Нет такого —
          проект создаётся
        in: header
        name: X-Project
        type: string
      - description: Имя проекта, если не передан заголовок (также project_name, app)
        in: query
        name: project
        type: string
      - description: ID проекта, если имя не передано
        in: query
        name: project_id
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Пачка событий принята в очередь обработки
          schema:
            properties:
              accepted_count:
                type: integer
              status:
                type: string
            type: object
        "400":
          description: Невалидный JSON, пустой список или превышен лимит в 50 событий
        "403":
          description: IP-адрес клиента не входит в ALLOWED_IPS и запрос пришёл не
            с хоста сервиса
      summary: Пакетная отправка событий ошибок (Batch Ingestion)
      tags:
      - Events (Прием событий)
  /api/events/stream:
    get:
      description: Постоянное соединение Server-Sent Events (SSE), передающее события
        новых ошибок (incident_new), регрессий (regression) и обновления счетчиков
        в формате JSON. Подходит для внешних утилит, ботов и кастомных дашбордов.
      produces:
      - text/event-stream
      responses:
        "200":
          description: Поток Server-Sent Events успешно установлен
          schema:
            type: string
        "403":
          description: IP-адрес клиента не входит в ALLOWED_IPS и запрос пришёл не
            с хоста сервиса
      summary: Поток событий в реальном времени (Server-Sent Events)
      tags:
      - Realtime (Потоковая передача)
  /api/health:
    get:
      description: Liveness/Readiness проба для Docker и Kubernetes. Возвращает статус
        сервиса, доступность базы SQLite, текущий размер очереди в памяти и время
        непрерывной работы (uptime).
      produces:
      - application/json
      responses:
        "200":
          description: Сервис полностью исправен и готов принимать запросы
          schema:
            $ref: '#/definitions/domain.HealthStatus'
        "403":
          description: IP-адрес клиента не входит в ALLOWED_IPS и запрос пришёл не
            с хоста сервиса
      summary: Проверка работоспособности сервиса (Health Check)
      tags:
      - System (Система)
  /api/incidents:
    get:
      description: Возвращает постраничный список сгруппированных инцидентов проекта.
        Поддерживает фильтрацию по статусу (unresolved, resolved, ignored, all), окружению,
        версии релиза, поисковой строке, только регрессиям, а также сортировку и пагинацию
        с метаданными.
      parameters:
      - default: unresolved
        description: 'Статус инцидента: unresolved (нерешенные, по умолчанию), resolved
          (закрытые), ignored (заглушенные), all (все)'
        enum:
        - unresolved
        - resolved
        - ignored
        - all
        in: query
        name: status
        type: string
      - description: Поисковый запрос для фильтрации по сообщению, имени класса, файлу
          или URL
        in: query
        name: q
        type: string
      - description: Окружение исполнения (напр. production, staging, local)
        in: query
        name: environment
        type: string
      - description: Версия релиза (first_release или last_release)
        in: query
        name: release
        type: string
      - description: 'Флаг регрессии: true — показать только ошибки, вернувшиеся после
          закрытия'
        in: query
        name: is_regression
        type: boolean
      - default: recent
        description: 'Сортировка: recent (свежие), count (по частоте повторов), first_seen
          (хронологически)'
        enum:
        - recent
        - count
        - first_seen
        in: query
        name: sort
        type: string
      - default: 1
        description: Номер страницы для пагинации (начиная с 1)
        in: query
        name: page
        type: integer
      - default: 50
        description: Количество записей на странице (от 1 до 200)
        in: query
        name: limit
        type: integer
      - default: false
        description: Включать ли полный стектрейс в каждый элемент списка (по умолчанию
          false для экономии трафика)
        in: query
        name: include_trace
        type: boolean
      - description: Имя проекта (также X-Project-Name, X-App-Name). Нет такого —
          проект создаётся
        in: header
        name: X-Project
        type: string
      - description: Имя проекта, если не передан заголовок (также project_name, app)
        in: query
        name: project
        type: string
      - description: ID проекта, если имя не передано
        in: query
        name: project_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешный возврат списка инцидентов с объектом пагинации meta
          schema:
            $ref: '#/definitions/domain.IncidentListResponse'
        "403":
          description: IP-адрес клиента не входит в ALLOWED_IPS и запрос пришёл не
            с хоста сервиса
        "500":
          description: Внутренняя ошибка сервера базы данных
      summary: Список инцидентов с фильтрацией и пагинацией
      tags:
      - Incidents (Инциденты)
  /api/incidents/{id}:
    delete:
      description: Безвозвратно удаляет запись об инциденте из базы данных. Полезно
        для очистки ошибочных логов или тестовых сбоев.
      parameters:
      - description: Идентификатор удаляемого инцидента
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Инцидент успешно удален (тело ответа пустое)
        "403":
          description: IP-адрес клиента не входит в ALLOWED_IPS и запрос пришёл не
            с хоста сервиса
        "404":
          description: Инцидент не найден
      summary: Удалить инцидент
      tags:
      - Incidents (Инциденты)
    get:
      description: 'Возвращает полные данные об инциденте: полный стектрейс ошибки,
        очищенный стектрейс приложения (без сторонних библиотек vendor/laravel/symfony),
        статистику фреймов кода и историю первого/последнего появления.'
      parameters:
      - description: Числовой идентификатор инцидента в базе данных
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Полная информация об инциденте со стектрейсами
          schema:
            $ref: '#/definitions/domain.IncidentDetail'
        "400":
          description: Некорректный ID инцидента
        "403":
          description: IP-адрес клиента не входит в ALLOWED_IPS и запрос пришёл не
            с хоста сервиса
        "404":
          description: Инцидент с указанным ID не найден
      summary: Детальная карточка инцидента
      tags:
      - Incidents (Инциденты)
  /api/incidents/{id}/ignore:
    post:
      consumes:
      - application/json
      description: Переводит инцидент в статус 'ignored'. События продолжат агрегироваться
        и подсчитываться в базе, но уведомления в Telegram отправляться не будут.
      parameters:
      - description: Идентификатор инцидента
        in: path
        name: id
        required: true
        type: integer
      - description: Флаг игнорирования
        in: body
        name: body
        schema:
          properties:
            ignored:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Статус игнорирования обновлен
          schema:
            $ref: '#/definitions/domain.Incident'
        "403":
          description: IP-адрес клиента не входит в ALLOWED_IPS и запрос пришёл не
            с хоста сервиса
        "404":
          description: Инцидент не найден
      summary: Заглушить / Игнорировать инцидент
      tags:
      - Incidents Lifecycle (Жизненный цикл)
  /api/incidents/{id}/reopen:
    post:
      description: Переводит ранее закрытый или заглушенный инцидент обратно в активный
        статус 'unresolved', сбрасывая статус резолва и флаг регрессии.
      parameters:
      - description: Идентификатор инцидента
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Инцидент успешно переоткрыт
          schema:
            $ref: '#/definitions/domain.Incident'
        "403":
          description: IP-адрес клиента не входит в ALLOWED_IPS и запрос пришёл не
            с хоста сервиса
        "404":
          description: Инцидент не найден
      summary: Переоткрыть инцидент
      tags:
      - Incidents Lifecycle (Жизненный цикл)
  /api/incidents/{id}/resolve:
    post:
      consumes:
      - application/json
      description: |-
        Помечает инцидент как решенный со стратегией отслеживания повторений:
        • immediate — закрыть немедленно (при любом новом появлении инцидент переоткроется);
        • next — исправлен в следующем релизе (новые события из текущего релиза будут глушиться);
        • current — исправлен в текущем активном релизе проекта;
        • version — исправлен в конкретной версии (напр. 1.4.3). События из более старых версий игнорируются, а в версии >= указанной — фиксируется регрессия.
      parameters:
      - description: Идентификатор инцидента
        in: path
        name: id
        required: true
        type: integer
      - description: Параметры резолва ошибки
        in: body
        name: body
        schema:
          $ref: '#/definitions/domain.ResolveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Инцидент успешно закрыт. Возвращает обновленные данные инцидента.
          schema:
            $ref: '#/definitions/domain.Incident'
        "403":
          description: IP-адрес клиента не входит в ALLOWED_IPS и запрос пришёл не
            с хоста сервиса
        "404":
          description: Инцидент не найден
      summary: Закрыть (резолвить) инцидент
      tags:
      - Incidents Lifecycle (Жизненный цикл)
