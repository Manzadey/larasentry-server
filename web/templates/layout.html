{{define "head"}}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0F131A', surface: '#151A23', raised: '#1C2230', line: '#252D3B',
            text: '#E7EAF0', 'text-2': '#C2C8D4', muted: '#8D96A8', faint: '#5F687A',
            red: '#F26B74', amber: '#F0A83A', green: '#3FC98E', blue: '#72A7FF'
          },
          fontFamily: {
            sans: ['IBM Plex Sans', 'system-ui', 'sans-serif'],
            mono: ['IBM Plex Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --bg: #0F131A; --surface: #151A23; --raised: #1C2230; --line: #252D3B;
      --text: #E7EAF0; --text-2: #C2C8D4; --muted: #8D96A8; --faint: #5F687A;
      --red: #F26B74; --amber: #F0A83A; --green: #3FC98E; --blue: #72A7FF;
      --red-bg: rgba(242,107,116,.12); --amber-bg: rgba(240,168,58,.14);
      --green-bg: rgba(63,201,142,.12); --blue-bg: rgba(114,167,255,.1);
      --sans: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
      color-scheme: dark;
    }
    html, body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font-family: inherit; }
    a { color: var(--blue); }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #36405A; }

    .dd-opt, .h-btn, .h-ghost, .h-primary, .h-seg, .h-tab, .h-row, .h-frame, .h-group, .h-input, .h-link, .opt-card {
      transition: background-color .12s ease, border-color .12s ease, color .12s ease, filter .12s ease;
    }
    .h-btn:hover { background: #1C2230 !important; border-color: #36405A !important; color: #E7EAF0 !important; }
    .h-ghost:hover { background: rgba(255,255,255,.06) !important; color: #E7EAF0 !important; }
    .h-primary:hover { filter: brightness(1.1); }
    .h-seg:hover, .h-tab:hover { color: #E7EAF0 !important; }
    .h-row:hover { background: rgba(255,255,255,.03) !important; }
    .h-row:hover .h-row-title { color: #fff !important; }
    .h-frame:hover { background: rgba(255,255,255,.04) !important; }
    .h-group:hover { background: #1C2230 !important; color: #E7EAF0 !important; }
    .h-input:hover { border-color: #36405A !important; }
    .h-input:focus { border-color: #72A7FF !important; box-shadow: 0 0 0 3px rgba(114,167,255,.18); outline: none; }
    .h-link:hover { text-decoration: underline !important; text-underline-offset: 3px; }
    .dd-opt:hover { background: #252D3B !important; }
    .opt-card:hover { border-color: #36405A !important; }

    .mono { font-family: var(--mono); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
      padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent;
      color: var(--text-2); font-size: 13px; font-weight: 500; line-height: 18px; cursor: pointer; text-decoration: none;
    }
    .btn-surface { background: var(--surface); color: var(--text); }
    .btn-ghost { border-color: transparent; color: var(--muted); font-weight: 400; }
    .btn-primary { border: 0; padding: 7px 12px; background: var(--green); color: #08130D; font-weight: 600; }
    .btn-danger { border: 0; padding: 7px 12px; background: var(--red); color: #1A0709; font-weight: 600; }
    .btn-icon { width: 32px; height: 32px; padding: 0; color: var(--muted); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(6,9,14,.62); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: 800px; max-width: calc(100% - 48px);
      background: var(--bg); border-left: 1px solid var(--line); display: flex; flex-direction: column;
      transform: translateX(100%); visibility: hidden; transition: transform .24s cubic-bezier(.2,.8,.2,1), visibility 0s linear .24s;
    }
    .drawer.open { transform: none; visibility: visible; transition: transform .24s cubic-bezier(.2,.8,.2,1); }
    @media (max-width: 600px) { .drawer { width: 100%; max-width: 100%; border-left: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
{{end}}
<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  {{template "head" .}}
  <title>{{block "title" .}}LaraSentry — инциденты{{end}}</title>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
  <style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline-flex; }
    @keyframes highlightRow { from { background-color: rgba(114,167,255,.12); } to { background-color: transparent; } }
    .row-highlight { animation: highlightRow 2.5s ease-out; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; align-items: center; gap: 8px; padding: 10px 14px;
      border-radius: 8px; border: 1px solid var(--line); background: var(--raised); color: var(--text); font-size: 13px;
      box-shadow: 0 12px 32px rgba(0,0,0,.45); opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
    .toast.show { opacity: 1; transform: none; }
  </style>
</head>
<body class="h-full flex flex-col overflow-hidden">
  <header class="shrink-0 min-h-[56px] px-5 py-2.5 border-b border-line flex items-center justify-between gap-x-4 gap-y-2 flex-wrap">
    <a href="/ui" class="flex items-center gap-2.5 no-underline text-text">
      <span class="w-7 h-7 rounded-md bg-red flex items-center justify-center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F131A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </span>
      <span class="text-base font-semibold tracking-tight">LaraSentry</span>
    </a>
    <nav aria-label="Основное меню" class="flex items-center gap-2 flex-wrap">
      <button id="live-toggle-btn" type="button" class="btn h-btn" onclick="toggleLiveStream()" aria-pressed="true">
        <span id="live-dot" class="w-2 h-2 rounded-full" style="background: var(--green)"></span>
        <span id="live-status-text">Обновляется в реальном времени</span>
      </button>
      <div id="paused-counter-pill" class="hidden">
        <button type="button" class="btn h-btn" onclick="flushPausedStream()" style="color: var(--amber)">
          <span id="paused-count">0</span> новых
        </button>
      </div>
      <button type="button" class="btn h-btn" onclick="openGitHubModal()" aria-haspopup="dialog">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>Репозиторий
      </button>
      <a href="/ui/github" class="btn btn-ghost h-ghost">Аккаунты GitHub</a>
      <a href="/swagger/" target="_blank" rel="noopener" class="btn btn-ghost h-ghost">API</a>
    </nav>
  </header>

  <main class="flex-1 flex overflow-hidden relative">
    {{template "content" .}}
  </main>

  <div id="drawer-backdrop" class="backdrop" onclick="closeDrawer()"></div>
  <aside id="detail-drawer" class="drawer" aria-label="Детали ошибки">
    <div id="detail-panel-content" class="h-full flex flex-col"></div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
    <span id="toast-message"></span>
  </div>

  <!-- Модальное окно настроек GitHub -->
  <div id="github-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/60">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          <h3 class="font-bold text-white text-sm">Привязка репозитория GitHub</h3>
        </div>
        <button onclick="closeGitHubModal()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <form action="/ui/projects/github-settings" method="POST" class="p-5 space-y-3.5 text-xs">
        <div>
          <label class="block font-medium text-slate-300 mb-1">Проект</label>
          <select name="project_id" id="github-project-select" onchange="onProjectSelectChange(this)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
            {{range .Projects}}
            <option value="{{.ID}}" data-repo-id="{{.GitHubRepoID}}" data-branch="{{.GitHubBranch}}" data-prefix="{{.PathPrefix}}">{{.Name}}</option>
            {{end}}
          </select>
        </div>

        <div>
          <label class="block font-medium text-slate-300 mb-1">Репозиторий GitHub</label>
          <select name="github_repo_id" id="github-repo-select" onchange="onRepoSelectChange(this)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
            <option value="0" data-branch="">— не привязан —</option>
            {{range .GitHubRepoGroups}}
            <optgroup label="{{.Label}}">
              {{range .Repos}}
              <option value="{{.ID}}" data-branch="{{.DefaultBranch}}">{{.FullName}}{{if .Private}} (private){{end}}</option>
              {{end}}
            </optgroup>
            {{end}}
          </select>
          {{if not .GitHubRepoGroups}}
          <p class="text-[11px] text-slate-500 mt-1">Нет выбранных репозиториев. <a href="/ui/github" class="text-indigo-400 hover:underline">Подключите аккаунт GitHub</a>.</p>
          {{end}}
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-300 mb-1">Ветка по умолчанию</label>
            <input type="text" name="github_branch" id="github-branch-input" placeholder="main" value="main" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
          </div>
          <div>
            <label class="block font-medium text-slate-300 mb-1">Префикс пути (Path Prefix)</label>
            <input type="text" name="path_prefix" id="github-prefix-input" placeholder="/var/www/html" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
          </div>
        </div>

        <div class="pt-3 border-t border-slate-800 flex items-center justify-end gap-2">
          <button type="button" onclick="closeGitHubModal()" class="px-3.5 py-2 rounded-xl text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 transition">
            Отмена
          </button>
          <button type="submit" class="px-4 py-2 rounded-xl text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 transition shadow-lg shadow-indigo-900/30">
            Сохранить настройки
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let isLiveActive = true;
    let pausedQueue = [];

    function openDrawer() {
      document.getElementById('detail-drawer').classList.add('open');
      document.getElementById('drawer-backdrop').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('detail-drawer').classList.remove('open');
      document.getElementById('drawer-backdrop').classList.remove('open');
    }

    function isDrawerOpen() {
      return document.getElementById('detail-drawer').classList.contains('open');
    }

    function toggleLiveStream() {
      isLiveActive = !isLiveActive;
      const btn = document.getElementById('live-toggle-btn');
      btn.setAttribute('aria-pressed', String(isLiveActive));
      document.getElementById('live-dot').style.background = isLiveActive ? 'var(--green)' : 'var(--amber)';
      document.getElementById('live-status-text').textContent = isLiveActive ? 'Обновляется в реальном времени' : 'Обновления на паузе';
      btn.style.color = isLiveActive ? '' : 'var(--amber)';
      if (isLiveActive) flushPausedStream();
    }

    function flushPausedStream() {
      const tbody = document.getElementById('incidents-table-body');
      while (pausedQueue.length > 0) {
        tbody.insertAdjacentHTML('afterbegin', pausedQueue.shift());
      }
      document.getElementById('paused-counter-pill').classList.add('hidden');
      document.getElementById('paused-count').textContent = '0';
    }

    document.addEventListener('htmx:sseBeforeMessage', function(evt) {
      if (!isLiveActive) {
        evt.preventDefault();
        pausedQueue.push(evt.detail.data);
        document.getElementById('paused-counter-pill').classList.remove('hidden');
        document.getElementById('paused-count').textContent = pausedQueue.length;
      }
    });

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function copyText(text, successMsg = 'Скопировано') {
      navigator.clipboard.writeText(text).then(() => showToast(successMsg)).catch(err => {
        console.error('Ошибка копирования:', err);
        showToast('Не удалось скопировать');
      });
    }

    // Управление фильтром стек-трейса (app vs all)
    let currentStackFilter = localStorage.getItem('larasentry_stack_filter') || 'app';

    function setStackTraceFilter(mode) {
      currentStackFilter = mode;
      localStorage.setItem('larasentry_stack_filter', mode);
      updateStackTraceFilterUI();
    }

    function updateStackTraceFilterUI() {
      const btnApp = document.getElementById('btn-filter-app');
      const btnAll = document.getElementById('btn-filter-all');
      const viewApp = document.getElementById('stack-trace-app-view');
      const viewAll = document.getElementById('stack-trace-all-view');

      if (!viewApp || !viewAll) return;

      const activeAppClass = 'px-2.5 py-1 rounded-md transition flex items-center gap-1.5 font-medium bg-rose-500/15 text-rose-300 border border-rose-500/30';
      const activeAllClass = 'px-2.5 py-1 rounded-md transition flex items-center gap-1.5 font-medium bg-slate-800 text-white border border-slate-700/80 shadow-xs';
      const inactiveClass = 'px-2.5 py-1 rounded-md transition flex items-center gap-1.5 font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent';

      if (currentStackFilter === 'app') {
        if (btnApp) btnApp.className = activeAppClass;
        if (btnAll) btnAll.className = inactiveClass;
        viewApp.classList.remove('hidden');
        viewAll.classList.add('hidden');
      } else {
        if (btnAll) btnAll.className = activeAllClass;
        if (btnApp) btnApp.className = inactiveClass;
        viewAll.classList.remove('hidden');
        viewApp.classList.add('hidden');
      }
    }

    function copyActiveStackTrace() {
      let text = '';
      if (currentStackFilter === 'app') {
        const el = document.getElementById('app-stack-trace');
        if (el) text = el.innerText.trim();
      }
      if (!text) {
        const el = document.getElementById('raw-stack-trace');
        if (el) text = el.innerText.trim();
      }

      if (text) {
        copyText(text, 'Стек-трейс скопирован!');
      } else {
        showToast('Стек-трейс пуст');
      }
    }

    function initStackTraceFilter() {
      const appPre = document.getElementById('app-stack-trace');
      const rawPre = document.getElementById('raw-stack-trace');
      const saved = localStorage.getItem('larasentry_stack_filter');

      if (saved === 'all') {
        currentStackFilter = 'all';
      } else if (!appPre && rawPre) {
        currentStackFilter = 'all';
      } else {
        currentStackFilter = 'app';
      }
      updateStackTraceFilterUI();
    }

    // Управление модальным окном GitHub
    function openGitHubModal() {
      const modal = document.getElementById('github-modal');
      if (modal) {
        modal.classList.remove('hidden');
        const select = document.getElementById('github-project-select');
        if (select) {
          onProjectSelectChange(select);
        }
      }
    }

    function closeGitHubModal() {
      const modal = document.getElementById('github-modal');
      if (modal) {
        modal.classList.add('hidden');
      }
    }

    function onProjectSelectChange(select) {
      if (!select) return;
      const opt = select.options[select.selectedIndex];
      if (!opt) return;
      const repoSelect = document.getElementById('github-repo-select');
      const branchInput = document.getElementById('github-branch-input');
      const prefixInput = document.getElementById('github-prefix-input');
      if (repoSelect) {
        repoSelect.value = opt.getAttribute('data-repo-id') || '0';
        // Привязанный репозиторий мог пропасть из выбранных — тогда в селекте нет такой опции
        if (repoSelect.value === '') repoSelect.value = '0';
      }
      if (branchInput) branchInput.value = opt.getAttribute('data-branch') || 'main';
      if (prefixInput) prefixInput.value = opt.getAttribute('data-prefix') || '';
    }

    function onRepoSelectChange(select) {
      const opt = select.options[select.selectedIndex];
      const branch = opt ? opt.getAttribute('data-branch') : '';
      const branchInput = document.getElementById('github-branch-input');
      if (branch && branchInput) branchInput.value = branch;
    }

    document.addEventListener('htmx:afterSwap', function(evt) {
      if (evt.detail.target && evt.detail.target.id === 'detail-panel-content') {
        initStackTraceFilter();
        if (typeof switchDetailTab === 'function') {
          switchDetailTab('stack');
        }
      }
    });

    function isTypingTarget(el) {
      return el && (el.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName));
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        const ghModal = document.getElementById('github-modal');
        if (ghModal && !ghModal.classList.contains('hidden')) {
          closeGitHubModal();
        } else if (isDrawerOpen()) {
          closeDrawer();
        }
        return;
      }
      if (e.key === '/' && !isTypingTarget(document.activeElement)) {
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
        }
      }
    });
  </script>
</body>
</html>
