<!DOCTYPE html>
<html lang="ru" class="dark h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}LaraSentry | Мониторинг логов{{end}}</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
            },
            surface: {
              800: '#1e293b',
              850: '#172033',
              900: '#0f172a',
              950: '#020617',
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'Menlo', 'Consolas', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- HTMX & SSE Extension -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>

  <style>
    /* Плавные переходы и скроллбары для логов */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    .htmx-indicator {
      display: none;
    }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator {
      display: inline-flex;
    }
    /* Подсветка новой строки при SSE swap */
    @keyframes highlightRow {
      0% { background-color: rgba(239, 68, 68, 0.25); }
      100% { background-color: transparent; }
    }
    .row-highlight {
      animation: highlightRow 2.5s ease-out;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased overflow-hidden">
  <!-- Верхний Navbar -->
  <header class="h-14 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-4 flex items-center justify-between z-30 shrink-0">
    <div class="flex items-center space-x-3">
      <!-- Логотип -->
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-rose-600 to-amber-500 flex items-center justify-center shadow-lg shadow-rose-900/30">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <div>
        <span class="font-bold tracking-tight text-white flex items-center gap-2">
          LaraSentry
          <span class="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700/60">Server UI</span>
        </span>
      </div>
    </div>

    <!-- Правые элементы управления -->
    <div class="flex items-center space-x-3">
      <!-- Индикатор Realtime / Пауза -->
      <button id="live-toggle-btn"
              onclick="toggleLiveStream()"
              type="button"
              class="flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-xs font-medium border border-slate-700/70 bg-slate-800/80 hover:bg-slate-700/80 transition-colors">
        <span id="live-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="live-status-text" class="text-emerald-400 font-mono">LIVE ON</span>
        <span class="text-slate-500 text-[10px]">(click to pause)</span>
      </button>

      <!-- Бейдж буфера событий во время паузы -->
      <div id="paused-counter-pill" class="hidden">
        <button onclick="flushPausedStream()" 
                class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-500/10 text-amber-300 border border-amber-500/30 hover:bg-amber-500/20 transition-all flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span id="paused-count">0</span> новых логов
        </button>
      </div>

      <!-- Документация / Swagger ссылка -->
      <a href="/swagger/" target="_blank" class="text-xs text-slate-400 hover:text-slate-200 px-2 py-1 rounded hover:bg-slate-800 transition">
        Swagger
      </a>
    </div>
  </header>

  <!-- Основной контент страницы -->
  <main class="flex-1 flex overflow-hidden relative">
    {{template "content" .}}
  </main>

  <!-- Боковая шторка (Drawer) деталей ошибки -->
  <div id="detail-drawer" 
       class="fixed inset-y-0 right-0 w-full sm:w-[650px] lg:w-[800px] bg-slate-900 border-l border-slate-800 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
    <!-- Сюда HTMX загружает частичный шаблон incident_detail.html -->
    <div id="detail-panel-content" class="h-full flex flex-col">
      <div class="p-6 text-slate-400 text-sm">Выберите инцидент для детального просмотра</div>
    </div>
  </div>

  <!-- Затемнение фона (Backdrop) для шторки -->
  <div id="drawer-backdrop" 
       onclick="closeDrawer()" 
       class="fixed inset-0 bg-black/60 backdrop-blur-xs z-40 hidden transition-opacity"></div>

  <!-- Всплывающий тост для копирования и уведомлений -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-16 opacity-0 transition-all duration-300 bg-slate-800 text-slate-200 border border-slate-700 px-4 py-2.5 rounded-xl shadow-xl flex items-center space-x-2 text-sm">
    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
    <span id="toast-message">Скопировано в буфер</span>
  </div>

  <!-- Базовые клиентские скрипты (шторка, пауза, горячие клавиши) -->
  <script>
    let isLiveActive = true;
    let pausedQueue = [];

    function openDrawer() {
      document.getElementById('detail-drawer').classList.remove('translate-x-full');
      document.getElementById('drawer-backdrop').classList.remove('hidden');
    }

    function closeDrawer() {
      document.getElementById('detail-drawer').classList.add('translate-x-full');
      document.getElementById('drawer-backdrop').classList.add('hidden');
    }

    function toggleLiveStream() {
      isLiveActive = !isLiveActive;
      const dot = document.getElementById('live-dot');
      const text = document.getElementById('live-status-text');
      const btn = document.getElementById('live-toggle-btn');
      const pausedPill = document.getElementById('paused-counter-pill');

      if (isLiveActive) {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
        text.className = 'text-emerald-400 font-mono';
        text.textContent = 'LIVE ON';
        pausedPill.classList.add('hidden');
        flushPausedStream();
        showToast('Realtime стриминг возобновлен');
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-amber-500';
        text.className = 'text-amber-400 font-mono';
        text.textContent = 'PAUSED';
        showToast('Realtime стриминг на паузе');
      }
    }

    function flushPausedStream() {
      if (pausedQueue.length > 0) {
        const tbody = document.getElementById('incidents-table-body');
        while (pausedQueue.length > 0) {
          const itemHtml = pausedQueue.shift();
          tbody.insertAdjacentHTML('afterbegin', itemHtml);
        }
      }
      document.getElementById('paused-counter-pill').classList.add('hidden');
      document.getElementById('paused-count').textContent = '0';
    }

    // Перехват SSE события перед вставкой в DOM для обработки паузы
    document.addEventListener('htmx:sseBeforeMessage', function(evt) {
      if (!isLiveActive) {
        evt.preventDefault();
        pausedQueue.push(evt.detail.data);
        const pill = document.getElementById('paused-counter-pill');
        pill.classList.remove('hidden');
        document.getElementById('paused-count').textContent = pausedQueue.length;
      }
    });

    // Показ тоста
    function showToast(message) {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-message');
      msg.textContent = message;
      toast.classList.remove('translate-y-16', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-16', 'opacity-0');
      }, 2500);
    }

    // Копирование в буфер
    function copyText(text, successMsg = 'Скопировано!') {
      navigator.clipboard.writeText(text).then(() => {
        showToast(successMsg);
      }).catch(err => {
        console.error('Ошибка копирования:', err);
      });
    }

    // Управление фильтром стек-трейса (app vs all)
    let currentStackFilter = localStorage.getItem('larasentry_stack_filter') || 'app';

    function setStackTraceFilter(mode) {
      currentStackFilter = mode;
      localStorage.setItem('larasentry_stack_filter', mode);
      updateStackTraceFilterUI();
    }

    function updateStackTraceFilterUI() {
      const btnApp = document.getElementById('btn-filter-app');
      const btnAll = document.getElementById('btn-filter-all');
      const viewApp = document.getElementById('stack-trace-app-view');
      const viewAll = document.getElementById('stack-trace-all-view');

      if (!viewApp || !viewAll) return;

      const activeAppClass = 'px-2.5 py-1 rounded-md transition flex items-center gap-1.5 font-medium bg-rose-500/15 text-rose-300 border border-rose-500/30';
      const activeAllClass = 'px-2.5 py-1 rounded-md transition flex items-center gap-1.5 font-medium bg-slate-800 text-white border border-slate-700/80 shadow-xs';
      const inactiveClass = 'px-2.5 py-1 rounded-md transition flex items-center gap-1.5 font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent';

      if (currentStackFilter === 'app') {
        if (btnApp) btnApp.className = activeAppClass;
        if (btnAll) btnAll.className = inactiveClass;
        viewApp.classList.remove('hidden');
        viewAll.classList.add('hidden');
      } else {
        if (btnAll) btnAll.className = activeAllClass;
        if (btnApp) btnApp.className = inactiveClass;
        viewAll.classList.remove('hidden');
        viewApp.classList.add('hidden');
      }
    }

    function copyActiveStackTrace() {
      let text = '';
      if (currentStackFilter === 'app') {
        const el = document.getElementById('app-stack-trace');
        if (el) text = el.innerText.trim();
      }
      if (!text) {
        const el = document.getElementById('raw-stack-trace');
        if (el) text = el.innerText.trim();
      }

      if (text) {
        copyText(text, 'Стек-трейс скопирован!');
      } else {
        showToast('Стек-трейс пуст');
      }
    }

    function initStackTraceFilter() {
      const appPre = document.getElementById('app-stack-trace');
      const rawPre = document.getElementById('raw-stack-trace');
      const saved = localStorage.getItem('larasentry_stack_filter');

      if (saved === 'all') {
        currentStackFilter = 'all';
      } else if (!appPre && rawPre) {
        currentStackFilter = 'all';
      } else {
        currentStackFilter = 'app';
      }
      updateStackTraceFilterUI();
    }

    // Слушатель HTMX после подгрузки содержимого шторки
    document.addEventListener('htmx:afterSwap', function(evt) {
      if (evt.detail.target && evt.detail.target.id === 'detail-panel-content') {
        initStackTraceFilter();
      }
    });

    // Горячие клавиши
    document.addEventListener('keydown', function(e) {
      // Escape закрывает шторку
      if (e.key === 'Escape') {
        closeDrawer();
      }
      // '/' фокусирует поле поиска (если фокус не в input)
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
          searchInput.focus();
          searchInput.select();
        }
      }
    });
  </script>
</body>
</html>
