name: CI / CD Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Деплой не отменяем: прерванный посреди выкладки, он оставит сервис остановленным
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v ./...

      - name: Check build
        run: CGO_ENABLED=0 go build -v -o /dev/null ./cmd/app

  build:
    name: Build Linux binary
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o larasentry-server ./cmd/app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: larasentry-server
          path: |
            larasentry-server
            deploy/deploy.sh
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: larasentry-server
          path: dist

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}
          USER_NAME: ${{ secrets.SERVER_USER }}
        run: |
          ssh_opts=(-i ~/.ssh/deploy_key -o BatchMode=yes)
          scp "${ssh_opts[@]}" -P "$PORT" dist/larasentry-server "$USER_NAME@$HOST:larasentry-server.new"
          scp "${ssh_opts[@]}" -P "$PORT" dist/deploy/deploy.sh "$USER_NAME@$HOST:deploy.sh"
          ssh "${ssh_opts[@]}" -p "$PORT" "$USER_NAME@$HOST" 'bash ~/deploy.sh ~/larasentry-server.new'
